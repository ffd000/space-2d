name: Build Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         # cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload bundle as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-bundle
          path: bundle.js
          
      - name: Commit updated bundle back to repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bundle.js
          git commit -m "auto: rebuild bundle.js" || exit 0
          git push
